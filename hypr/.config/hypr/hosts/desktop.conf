# Desktop-specific configuration

# Monitor configuration
monitor = DP-2, highres, auto, 2
monitor = HDMI-A-1, 3840x2160@120, auto, 2

input {
    kb_layout = de
    kb_options = caps:escape

    follow_mouse = 1

    repeat_rate = 38 # was default 25, ~50% faster
    repeat_delay = 300

    sensitivity = -0.8 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# Use system swayosd
exec-once = swayosd-server -s ~/.config/swayosd/style.css &

exec-once = hypridle -c ~/.config/hypr/hypridle-desktop.conf
