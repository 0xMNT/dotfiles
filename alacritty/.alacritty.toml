#import = [
#  "~/.config/alacritty/catppuccin-mocha.toml"
#]

[general]
live_config_reload = true

[env]
TERM = "xterm-256color"

[font]
size = 12
normal = { family = "JetBrainsMono NL Nerd Font Mono" }

[window]
startup_mode = "Maximized"
decorations = "none"

[colors.primary]
background = "#0D101B"

[mouse]
hide_when_typing = true

[[keyboard.bindings]]
key = "C"
mods = "Alt"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Alt"
action = "Paste"
